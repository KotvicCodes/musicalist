<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Musicalist</title>
          <link rel="stylesheet" href="index.css" />
          <script defer src="renderer.js"></script>
     </head>
     <body class="body">
          <!--! Header -->
          <header class="header">
               <div class="header__brand">
                    <h1 class="header__title">Musicalist</h1>
                    <p class="header__tagline">Scrape song metadata, one list at a time.</p>
               </div>
               <button id="helpButtonQ" class="button button--ghost" title="Open the project README">
                    Help
               </button>
          </header>

          <!--! Main -->
          <main class="main">
               <!--* Input -->
               <section class="card" id="inputQ">
                    <label class="field__label" for="inputTextareaQ">Your songs</label>
                    <p class="field__hint">Enter songs separated by commas.</p>
                    <textarea
                         id="inputTextareaQ"
                         class="field__textarea"
                         placeholder="Bohemian Rhapsody, Smells Like Teen Spirit, Billie Jean"
                    ></textarea>
                    <div class="actions">
                         <button id="scrapeButtonQ" class="button button--primary">Proceed</button>
                         <span id="statusQ" class="status" aria-live="polite"></span>
                    </div>
               </section>

               <!--* Advanced settings -->
               <section class="card card--muted">
                    <button id="advancedButtonQ" class="disclosure" aria-expanded="false">
                         <span class="disclosure__caret">▸</span> Advanced settings
                    </button>
                    <div id="advancedQ" class="advanced hidden">
                         <div class="field">
                              <label class="field__label" for="initialDelayQ">
                                   Cookie settle delay (ms)
                              </label>
                              <p class="field__hint">
                                   Time given to the cookie extension before scraping starts.
                              </p>
                              <input id="initialDelayQ" class="field__input" type="number" min="0" />
                         </div>
                         <div class="field">
                              <label class="field__label" for="keyDelayQ"
                                   >Delay between key strikes (ms)</label
                              >
                              <input id="keyDelayQ" class="field__input" type="number" min="0" />
                         </div>
                    </div>
               </section>

               <!--* Output -->
               <section id="outputQ" class="output"></section>
          </main>
     </body>
</html>
