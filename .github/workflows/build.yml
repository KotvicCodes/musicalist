name: Build

# Electron Forge can only build for the platform it runs on: Squirrel needs
# Windows, deb and rpm need Linux, and the macOS app needs macOS. One runner per
# platform is the only way to produce a complete release.
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to rebuild, which must already exist. Leave blank to build this branch. Pushing a new tag runs this automatically.'
                required: false
                type: string

# Needed so the release job can attach the finished packages.
permissions:
    contents: write

jobs:
    build:
        name: ${{ matrix.label }}
        runs-on: ${{ matrix.os }}
        strategy:
            # One platform failing should not hide whether the others worked.
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      label: macOS (Apple Silicon)
                    - os: windows-latest
                      label: Windows (x64)
                    - os: ubuntu-latest
                      label: Linux (deb and rpm)

        steps:
            # Checking out a tag that does not exist fails inside git with a
            # bare exit code 1, after three slow retries, and says nothing about
            # the cause. Catch it first and say what is actually wrong.
            - name: Check the tag exists
              if: inputs.tag != ''
              shell: bash
              run: |
                  if ! git ls-remote --tags --exit-code \
                       "https://github.com/${{ github.repository }}" \
                       "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
                       echo "::error::Tag ${{ inputs.tag }} does not exist. Create and push it first: git tag -a ${{ inputs.tag }} -m 'Musicalist ${{ inputs.tag }}' && git push origin ${{ inputs.tag }}. Pushing a tag starts this workflow on its own, so there is no need to run it by hand."
                       exit 1
                  fi

            - name: Check out
              uses: actions/checkout@v7
              with:
                  # A manual run builds whatever tag was typed in; a tag push
                  # builds itself.
                  ref: ${{ inputs.tag || github.ref }}

            # A tag is an immutable snapshot, so rebuilding an old tag rebuilds
            # its old source. Printing what was actually checked out makes that
            # obvious instead of leaving you wondering why a fix on main did not
            # take effect.
            - name: Report what is being built
              shell: bash
              run: |
                  echo "ref built:  ${{ inputs.tag || github.ref }}"
                  echo "commit:     $(git rev-parse --short HEAD)"
                  node -e 'const p=require("./package.json"); console.log("version:   ", p.version); console.log("license:   ", p.license ?? "MISSING (the rpm build will fail)")'

            # Electron 43 bundles Node 24, so the tests run on the same runtime
            # that will actually execute this code in the packaged app. This
            # tracks whichever Electron is pinned rather than standing still:
            # 36 bundled Node 22, and leaving this at 22 would have meant testing
            # on a runtime the shipped app no longer uses.
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # The deb and rpm makers shell out to these; they are not on the
            # runner by default.
            - name: Install Linux packaging tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

            - name: Install dependencies
              run: npm ci

            # A broken build must never reach a release.
            - name: Run tests
              run: npm test

            - name: Build
              run: npm run make

            # A bundle can package, sign and verify cleanly and still be unable
            # to start. 1.0.2 shipped a valid signature whose hardened runtime
            # switched on library validation, which then refused to load the app's
            # own Electron Framework because an ad-hoc signature carries no Team ID
            # to match against. Every static check passed; the app died in dyld
            # before any of its code ran. Only starting it catches that.
            #
            # dyld resolves and validates every linked library before main(), so a
            # failure of this kind lands within the first second and needs no
            # window server. Ten seconds is well past that and still cheap.
            - name: Check the built app starts
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  set -uo pipefail
                  APP=out/musicalist-darwin-arm64/musicalist.app/Contents/MacOS/musicalist

                  "$APP" >launch.log 2>&1 &
                  PID=$!
                  sleep 10

                  if kill -0 "$PID" 2>/dev/null; then
                       kill "$PID" 2>/dev/null || true
                       wait "$PID" 2>/dev/null || true
                       echo "the app was still running after 10s"
                       exit 0
                  fi

                  wait "$PID" || STATUS=$?
                  echo "::error::The packaged app exited on its own with status ${STATUS:-0} rather than staying up. It builds and signs, but it cannot run. Its output follows."
                  cat launch.log
                  exit 1

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.os }}
                  path: out/make/**/*
                  if-no-files-found: error

    release:
        name: Attach to release
        needs: build
        # Without this, a manual run of a branch falls through to the release step
        # with TAG set to the branch name, and publishes a release called main. A
        # branch build should produce artifacts to download and nothing else, which
        # is also what makes it safe to use a manual run to test this workflow.
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        runs-on: ubuntu-latest
        steps:
            - name: Download every platform's packages
              uses: actions/download-artifact@v8
              with:
                  path: packages

            # Uploading through the bundled gh CLI keeps this workflow free of
            # third-party actions. --clobber lets a rerun replace assets rather
            # than failing, which is what makes backfilling an existing release
            # work. Filenames are read into an array because Squirrel names its
            # installer with a space in it.
            - name: Attach packages to the release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  mapfile -t FILES < <(find packages -type f | sort)
                  printf 'attaching to %s:\n' "$TAG"
                  printf '  %s\n' "${FILES[@]}"

                  # A tag pushed without a release yet needs one creating first.
                  if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                       gh release create "$TAG" --repo "$REPO" --title "Musicalist ${TAG#v}" --generate-notes
                  fi

                  gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
